<!doctype html>
<meta charset="utf-8">
<!--
  Source of truth for the app icon. Rendered headlessly by build-app.sh:
    chrome --headless --screenshot --window-size=1024,1024 --force-device-scale-factor=2
  => a 2048px PNG, downsampled into the .iconset.

  HTML rather than hand-written SVG so the geometry is computed, not trigonometry
  done by hand, and so the design can be iterated in a browser.

  1024 canvas with the tile at 824 centred is Apple's macOS icon grid: the 100px
  margin is where the system's drop shadow lives, so it must stay transparent.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .tile {
    width: 824px; height: 824px; border-radius: 184px;
    background:
      radial-gradient(120% 100% at 30% 0%, #3A4256 0%, #232937 45%, #12141A 100%);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.13),
      inset 0 -2px 0 rgba(0,0,0,.45);
    position: relative; overflow: hidden;
  }
  /* Glass sweep across the top third — reads as depth at 512px, invisible at 32px. */
  .tile::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(163deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 42%);
    pointer-events: none;
  }
  svg { position: absolute; inset: 0; }
</style>
<div class="tile"><svg id="g" viewBox="0 0 824 824"></svg></div>
<script>
const CX = 412, CY = 462, R = 264;      // gauge centre + arc radius
const A0 = 140, A1 = 400;               // sweep: lower-left, over the top, to lower-right
const VALUE = 0.68;                     // needle position — amber, "watch this"

const rad = a => a * Math.PI / 180;
const pt  = (a, r) => [CX + r * Math.cos(rad(a)), CY + r * Math.sin(rad(a))];
const arc = (a0, a1, r) => {
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M ${x0} ${y0} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
};
const el = (n, attrs) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", n);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

const svg = document.getElementById("g");

// Gradient runs left-to-right across the arc: headroom -> caution -> spent.
svg.append(el("defs", {}));
svg.querySelector("defs").innerHTML = `
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#34D399"/>
    <stop offset=".52"  stop-color="#FBBF24"/>
    <stop offset="1"    stop-color="#F0616B"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>`;

// Unlit track, then the lit sweep glowing over it.
svg.append(el("path", { d: arc(A0, A1, R), fill: "none", stroke: "rgba(255,255,255,.09)",
                        "stroke-width": 54, "stroke-linecap": "round" }));
svg.append(el("path", { d: arc(A0, A1, R), fill: "none", stroke: "url(#sweep)",
                        "stroke-width": 54, "stroke-linecap": "round",
                        filter: "url(#soft)", opacity: ".55" }));
svg.append(el("path", { d: arc(A0, A1, R), fill: "none", stroke: "url(#sweep)",
                        "stroke-width": 40, "stroke-linecap": "round" }));

// Ticks sit inside the track. Every 5th is long, the way a real dial reads.
for (let i = 0; i <= 20; i++) {
  const a = A0 + (A1 - A0) * (i / 20), major = i % 5 === 0;
  const [x0, y0] = pt(a, R - 40), [x1, y1] = pt(a, R - (major ? 76 : 62));
  svg.append(el("line", { x1: x0, y1: y0, x2: x1, y2: y1,
    stroke: major ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.24)",
    "stroke-width": major ? 9 : 6, "stroke-linecap": "round" }));
}

// Needle as a tapered triangle rather than a line — holds its shape when downsampled.
const na = A0 + (A1 - A0) * VALUE;
const [tx, ty] = pt(na, R - 62);
const [lx, ly] = pt(na - 90, 34);
const [rx, ry] = pt(na + 90, 34);
svg.append(el("path", { d: `M ${tx} ${ty} L ${lx} ${ly} L ${rx} ${ry} Z`,
                        fill: "#F5F2EC" }));

// Hub, in Claude's warm accent.
svg.append(el("circle", { cx: CX, cy: CY, r: 44, fill: "#12141A" }));
svg.append(el("circle", { cx: CX, cy: CY, r: 34, fill: "#D97757" }));
svg.append(el("circle", { cx: CX, cy: CY, r: 13, fill: "#12141A", opacity: ".55" }));
</script>
