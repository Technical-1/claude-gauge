name: Release

# Tag-driven. `git tag v1.0.1 && git push --tags` is the whole release ritual.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:            # so the pipeline can be exercised without a tag

jobs:
  release:
    name: Build, sign, notarize, release
    runs-on: macos-latest
    permissions:
      contents: write           # job level, not workflow level

    steps:
      - uses: actions/checkout@v6

      # A rustup-managed toolchain, which is what makes a universal build
      # possible — a Homebrew rustc ships host-only std and cannot cross-compile.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT=$RUNNER_TEMP/cert.p12
          KC=$RUNNER_TEMP/signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          # Not optional. Without it the key is present but codesign cannot use
          # it non-interactively, and fails with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KC"
          security list-keychains -d user -s "$KC"
          rm -f "$CERT"

      # build-app.sh does the bundling, signing, notarizing, stapling, the
      # quarantine check and the packaging. Reproducing any of that here would
      # be a second copy to keep in step with the local one.
      - name: Build, sign, notarize, staple
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          # A fresh runner has no notarytool keychain profile, so the API key is
          # written to disk for the run and build-app.sh picks it up.
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/key.p8"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$APPLE_API_KEY_PATH"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          ./build-app.sh --universal --icon

      - name: Verify the artifact the way a user receives it
        run: |
          APP="dist/Claude Usage.app"
          lipo -archs "$APP/Contents/MacOS/claude-usage"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type install --verbose "$APP"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # workflow_dispatch has no tag, so exercise the build without releasing.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag — build verified, nothing published."
            exit 0
          fi
          gh release create "$TAG" dist/Claude-Usage-*.zip \
            --title "Claude Usage $TAG" \
            --notes "Signed, notarized and stapled. Universal (Apple Silicon and Intel).

          Download the zip, unzip, and drag to Applications." \
            --latest
