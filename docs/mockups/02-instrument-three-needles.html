<!doctype html><meta charset="utf-8"><title>INSTRUMENT, THREE NEEDLES</title>
<style>
/* ==================================================================
   INSTRUMENT, THREE NEEDLES
   Renders at 1024, 128, 64 and 32px. 32px is the binding size.
   Three needles on one dial — the app's actual subject, stated literally.
   Personality: The same machined dial, carrying three readings at once.
   Cream face, three needles in account colours, no coloured arc.
   Anti-goal: A clock. Three hands on a round face is a very short trip to one.

   TYPE: none. An app icon carries no text, so the "named type" slot of
   the thesis header does not apply — the register is carried entirely by
   silhouette, weight and colour.
   ================================================================== */
  html,body{margin:0;background:transparent}
  body{width:100vw;height:100vh;display:grid;place-items:center}
  #tile{width:80.5vmin;height:80.5vmin;border-radius:17.9vmin;position:relative;overflow:hidden;
    background:linear-gradient(168deg,#EFE6D6,#DCCDB6);box-shadow:inset 0 5px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(0,0,0,.18)}
  svg{position:absolute;inset:0;width:100%;height:100%}
</style>
<div id="tile"><svg id="g" viewBox="0 0 824 824" preserveAspectRatio="xMidYMid meet"></svg></div>
<script>
const rad=a=>a*Math.PI/180;
const pt=(a,r,cx=412,cy=412)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
const arc=(a0,a1,r,cx=412,cy=412)=>{const[x0,y0]=pt(a0,r,cx,cy),[x1,y1]=pt(a1,r,cx,cy);
  return `M ${x0} ${y0} A ${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
const el=(n,a)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",n);
  for(const k in a)e.setAttribute(k,a[k]);return e};
const svg=document.getElementById("g"), add=(n,a)=>svg.append(el(n,a));
const needle=(a,cx,cy,len,w,fill)=>{const[tx,ty]=pt(a,len,cx,cy),
  [lx,ly]=pt(a-90,w,cx,cy),[rx,ry]=pt(a+90,w,cx,cy);
  add("path",{d:`M ${tx} ${ty} L ${lx} ${ly} L ${rx} ${ry} Z`,fill})};
const ticks=(A0,A1,R,cx,cy,col,n=10)=>{for(let i=0;i<=n;i++){const a=A0+(A1-A0)*(i/n),maj=i%5===0;
  const[x0,y0]=pt(a,R-30,cx,cy),[x1,y1]=pt(a,R-(maj?76:56),cx,cy);
  add("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:col,"stroke-width":maj?14:8,"stroke-linecap":"round"})}};

  const CY=452,R=250,A0=150,A1=390;
  add("circle",{cx:412,cy:CY,r:R+62,fill:"#1C1714"});
  add("circle",{cx:412,cy:CY,r:R+40,fill:"#F6EEE0"});
  add("path",{d:arc(A0,A1,R,412,CY),fill:"none",stroke:"#2A2320","stroke-width":22,"stroke-linecap":"round"});
  ticks(A0,A1,R,412,CY,"#2A2320");
  [[.22,"#2F8F5B"],[.55,"#E0A21B"],[.93,"#D14A32"]].forEach(([v,c])=>
    needle(A0+(A1-A0)*v,412,CY,R-34,26,c));
  add("circle",{cx:412,cy:CY,r:56,fill:"#1C1714"}); add("circle",{cx:412,cy:CY,r:26,fill:"#F6EEE0"});
</script>
